[package]
name = "polynomials-ecc"
version = "0.1.0"
edition = "2024"
license = "MIT"
keywords = ["polynomials", "fft", "ifft", "crypto"]
categories = ["cryptography", "mathematics"]
description = "A library for operating on polynomials over the BLS12-381"
repository = "https://github.com/xevisalle/polynomials-ecc"

[dependencies]
bls12_381 = "0.8.0"
blst = "0.3.16"
thiserror = "2.0"
bytemuck = "1.24.0"

[dev-dependencies]
rand = "0.8.5"
ff = "0.13.1"
